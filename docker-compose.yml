# Local PostgreSQL for development: `docker compose up -d db`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: amerivo
      POSTGRES_PASSWORD: amerivo
      POSTGRES_DB: amerivo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
