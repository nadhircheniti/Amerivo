# Render Blueprint — Amerivo API (staging, free plan).
# Render → New → Blueprint → select this repository. Secrets marked `sync: false` are asked at creation.
services:
  - type: web
    name: amerivo-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # --include=dev: NODE_ENV=production would otherwise skip the Nest CLI/TypeScript needed to build.
    buildCommand: npm ci --include=dev && npm run build -w api
    # Applies pending database migrations, then starts the API.
    startCommand: npm run start:prod -w api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # Neon connection string (…?sslmode=require)
        sync: false
      - key: DB_POOL_MAX         # keep small on Neon's free plan
        value: "5"
      - key: SEED_DEMO           # "1" = load demo teachers/students at start (staging only; safe to re-run)
        value: "1"
      - key: WEB_URL             # Vercel URL(s) for CORS, comma-separated; "*" allowed for previews:
        sync: false              # https://amerivo-api.vercel.app,https://amerivo-api-*.vercel.app
      - key: PAYMENTS_SIMULATED  # "1" = bookings confirmed without payment while STRIPE_SECRET_KEY is missing (staging only; ignored once Stripe is set)
        value: "1"
      - key: ADMIN_EMAILS        # comma-separated e-mails that become admins when they sign up (verified e-mail)
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DAILY_API_KEY
        sync: false
      - key: DAILY_DOMAIN        # optional, e.g. amerivo.daily.co (found automatically when empty)
        sync: false
      - key: CLASSROOM_EARLY_MIN # staging only: minutes before a lesson when the classroom opens (default 10; 1440 = the day before)
        value: "1440"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM          # once amerivoenglish.com is verified in Resend: "Amerivo English <contact@amerivoenglish.com>"
        value: "Amerivo English <onboarding@resend.dev>"
      - key: SUPPORT_EMAIL       # receives the contact form copies; Reply-To of every e-mail sent to customers
        value: "contact@amerivoenglish.com"
